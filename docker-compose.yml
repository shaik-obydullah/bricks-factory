services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: bricks-app
        restart: no
        working_dir: /var/www
        volumes:
            - .:/var/www
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - bricks-network
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        container_name: bricks-nginx
        restart: no
        ports:
            - "8092:80"
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - bricks-network
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: bricks-mysql
        restart: no
        ports:
            - "8094:3306"
        environment:
            MYSQL_DATABASE: bricks_factory
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_USER: bricks_user
            MYSQL_PASSWORD: bricks_password
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - bricks-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            timeout: 20s
            retries: 10

    phpmyadmin:
        image: phpmyadmin:5.2
        container_name: bricks-pma
        restart: no
        ports:
            - "8093:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: bricks_user
            PMA_PASSWORD: bricks_password
            UPLOAD_LIMIT: 100M
        networks:
            - bricks-network
        depends_on:
            - mysql

networks:
    bricks-network:
        driver: bridge

volumes:
    mysql_data:
